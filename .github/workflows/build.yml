name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and fix Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -q ScientificCalculator.zip -d extracted

          PROJECT_DIR="extracted/ScientificCalculator"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Fixing hidden Unicode characters in filenames ==="

          find "$PROJECT_DIR" -depth -name $'\u200b*' -print0 | while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"
            base="$(basename "$file")"
            clean="${base//$'\u200b'/}"

            echo "Renaming: [$base] -> [$clean]"
            mv "$file" "$dir/$clean"
          done

          echo "=== APP FILES AFTER FIX ==="
          ls -lab "$PROJECT_DIR/app"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts still not found"
            exit 1
          fi

          echo "OK: app/build.gradle.kts fixed successfully"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle wrapper

          chmod +x gradlew

          echo "=== Wrapper generated ==="
          ls -la gradlew
          ls -la gradle/wrapper/

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScientificCalculator-APK
          path: extracted/ScientificCalculator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
