name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          unzip -o ScientificCalculator.zip
          # Copy content if inside a subfolder
          if [ -d "ScientificCalculator" ]; then
            cp -rn ScientificCalculator/* . || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: |
          chmod +x gradlew || true
          find . -name "gradlew" -exec chmod +x {} \;

      - name: Build APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            find . -name "gradlew" -execdir ./gradlew assembleDebug \;
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScientificCalculator-APK
          path: "**/*.apk"
