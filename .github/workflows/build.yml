name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP and Fix Directory Structure
        run: |
          # فك الضغط كاملاً
          unzip -o ScientificCalculator.zip
          
          # البحث عن المكان الحقيقي لملف gradlew ونقل كل المكونات المجاورة له إلى الجذر
          GRADLEW_PATH=$(find . -mindepth 2 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "Found project directory at: $PROJECT_DIR"
            cp -rn $PROJECT_DIR/* . || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: |
          chmod +x gradlew || true
          find . -name "gradlew" -exec chmod +x {} \;

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScientificCalculator-APK
          path: "**/*.apk"
