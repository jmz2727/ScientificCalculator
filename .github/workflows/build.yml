name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and fix Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -q ScientificCalculator.zip -d extracted

          PROJECT_DIR="extracted/ScientificCalculator"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Fixing hidden Unicode characters in filenames ==="

          find "$PROJECT_DIR" -depth -name $'\u200b*' -print0 | while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"
            base="$(basename "$file")"
            clean="${base//$'\u200b'/}"

            echo "Renaming: [$base] -> [$clean]"
            mv "$file" "$dir/$clean"
          done

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi

          echo "OK: Android project prepared"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Gradle Wrapper 8.2
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle wrapper \
            --gradle-version 8.2 \
            --distribution-type bin \
            --no-configuration-cache

          chmod +x gradlew

          echo "=== Gradle Wrapper ==="
          ./gradlew --version

          echo "=== Wrapper Properties ==="
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-configuration-cache \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScientificCalculator-APK
          path: extracted/ScientificCalculator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
